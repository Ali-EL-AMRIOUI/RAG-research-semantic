apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rag-ingress
  namespace: rag
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # NEW — defense in depth. The frontend can't truly hide the API key
    # from the browser (see note on frontend/lib/api.ts), so a per-IP rate
    # limit on /api caps how fast an anonymous caller can hammer costly
    # endpoints (Groq calls, Qdrant writes) even if they extract the key
    # from devtools. Adjust the rate to your real usage pattern.
    nginx.ingress.kubernetes.io/limit-rps: "5"
spec:
  rules:
  - host: rag.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8000