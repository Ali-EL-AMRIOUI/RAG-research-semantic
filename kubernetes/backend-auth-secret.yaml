apiVersion: v1
kind: Secret
metadata:
  name: backend-auth-secret
  namespace: rag
type: Opaque
stringData:
  # Shared secret checked by app.core.security.verify_api_key() via the
  # X-API-Key header. Generate a real random value before deploying, e.g.:
  #   openssl rand -hex 32
  api-key: "REPLACE_WITH_A_RANDOM_SECRET"
