services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage
      - huggingface_cache:/root/.cache/huggingface

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rag_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    depends_on:
      - qdrant
   

  # GPU variant: `docker-compose --profile gpu up backend-gpu qdrant`
  # Default `docker-compose up` uses the CPU-only `backend` above and
  # works on any machine, with or without an NVIDIA GPU.
  backend-gpu:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rag_api_gpu
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    depends_on:
      - qdrant
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - gpu

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_API_KEY: ${NEXT_PUBLIC_API_KEY:-}
    container_name: rag_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
  volumes:
        huggingface_cache: